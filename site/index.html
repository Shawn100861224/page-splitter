<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>图片自动分区 · 按题目切段</title>
<meta name="description" content="上传一张照片，自动识别文字区块并按题目切开，可手动调整分界线，一键导出 ZIP。图片不上传，全部在本机浏览器里完成。">
<meta name="theme-color" content="#0f1115">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✂️</text></svg>">
<link rel="stylesheet" href="./src/style.css?v=3">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="logo" aria-hidden="true">✂</span>
    <div>
      <h1>图片自动分区</h1>
      <p class="sub">一张照片 → 按题目自动切段 → 导出 ZIP</p>
    </div>
  </div>
  <span class="privacy" title="所有计算都在你的浏览器里完成">🔒 图片不上传</span>
</header>

<main>
  <!-- 1. 选图 -->
  <section id="drop" class="drop" tabindex="0" role="button"
           aria-label="选择或拖入图片">
    <p class="drop-title">把照片拖进来，或点击选择</p>
    <p class="drop-hint">支持 JPG / PNG / WebP 相机原图 · 也可以直接 Ctrl+V 粘贴截图</p>
    <input id="file" type="file" accept="image/*" hidden>
  </section>

  <!-- 2. 编辑器 -->
  <section id="editor" class="editor" hidden>
    <div class="toolbar">
      <button id="btn-back" class="ghost" type="button">换一张</button>
      <label class="slider">
        <span>灵敏度 <output id="out-gap">0.36</output></span>
        <input id="gap" type="range" min="26" max="52" step="1" value="36">
      </label>
      <label class="slider">
        <span>留白 <output id="out-pad">28</output>px</span>
        <input id="pad" type="range" min="0" max="80" step="2" value="28">
      </label>
      <button id="btn-undo" class="ghost" type="button" disabled title="撤销上一次分界修改（Ctrl+Z）">撤销</button>
      <button id="btn-auto" class="ghost" type="button">重新分区</button>
      <button id="btn-add" class="ghost" type="button">+ 加一条分界</button>
      <button id="btn-zip" class="primary" type="button">导出 ZIP</button>
    </div>

    <p id="status" class="status" hidden></p>
    <ul id="warnings" class="warnings" hidden></ul>

    <div class="split">
      <div class="preview-wrap">
        <div id="stage" class="stage">
          <canvas id="preview"></canvas>
          <div id="overlay" class="overlay">
            <div id="bands" class="bands"></div>
            <div id="lines" class="lines"></div>
          </div>
        </div>
        <p class="tip">拖动横线调整分界 · 点横线右侧的 × 删除 · 点空白处加一条</p>
      </div>

      <ol id="list" class="list"></ol>
    </div>
  </section>
</main>

<footer class="foot">
  <p>
    纯前端，零后端：图片不离开本机浏览器，没有账号、没有上传、没有统计。
    算法是「二维背景归一化 → 行墨迹剖面 → 间距聚类」，参数由真实手写笔记照片标定。
  </p>
</footer>

<script type="module" src="./src/main.js?v=2"></script>
</body>
</html>
